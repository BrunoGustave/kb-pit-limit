<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>KB Pit Limit</title>
  <link rel="icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="format-detection" content="telephone=no" />

  <link rel="stylesheet" crossorigin href="./assets/index-Prhw6DJz.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <button id="btnProject" class="brand" aria-label="Projets">
        <span class="logo"></span>
        <span class="brand-txt"><b>KB Pit Limit</b><small id="projName">—</small></span>
      </button>
      <button id="gpsPill" class="pill off" aria-label="GPS"><i></i><span>GPS</span></button>
    </header>

    <main id="view"></main>

    <div id="alert" class="alert hidden"></div>
    <button id="compass" class="compass" aria-label="Nord"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18"/><path d="M20 5 L25 20 L20 17 L15 20Z" class="n"/><path d="M20 35 L25 20 L20 23 L15 20Z" class="s"/><text x="20" y="13.5">N</text></svg></button>

    <div id="fabs">
      <button id="fabLocate" class="fab" aria-label="Ma position"></button>
      <button id="fabMode" class="fab" aria-label="3D / Plan"></button>
      <button id="fabFit" class="fab" aria-label="Tout voir"></button>
      <button id="fabLayers" class="fab" aria-label="Calques"></button>
      <button id="fabOrient" class="fab orient" aria-label="Vue orientée"></button>
    </div>

    <div id="toolbar" class="toolbar hidden">
      <div id="toolHint" class="hint"></div>
      <div class="row">
        <button id="toolUndo" class="btn ghost">↶</button>
        <button id="toolDone" class="btn primary"></button>
        <button id="toolCancel" class="btn ghost"></button>
      </div>
    </div>

    <section id="hud" class="hud collapsed"></section>

    <nav id="tabs"></nav>

    <div id="sheet" class="sheet hidden" role="dialog">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" class="icon-btn" aria-label="Fermer">✕</button></div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>

    <input type="file" id="fileInput" multiple hidden />
    <div id="toast" class="toast"></div>
    <div id="busy" class="busy hidden"><div class="spinner"></div><p id="busyMsg"></p></div>
  </div>
</body>
</html>
